# ---------------------------------------------------------------------------
# Plesk → Websites & Domains → ltor.maazi.de → Apache & nginx Settings
#   "Additional directives for HTTP"   → paste this block
#   "Additional directives for HTTPS"  → paste this block
#
# Required Apache modules (Plesk → Tools & Settings → Apache Web Server):
#   proxy, proxy_http, proxy_wstunnel, headers
#
# The static frontend (index.html, assets/) is served by Plesk from the
# document root. Only /ltor goes to the Node backend on 127.0.0.1:8646.
# NEVER proxy "/" to the backend (it only speaks WebSocket + /ltor/health).
# ---------------------------------------------------------------------------

ProxyPreserveHost On
ProxyRequests Off

# Health check (HTTP)  →  https://ltor.maazi.de/ltor/health
ProxyPass        /ltor/health  http://127.0.0.1:8646/ltor/health
ProxyPassReverse /ltor/health  http://127.0.0.1:8646/ltor/health

# WebSocket JSON-RPC  →  wss://ltor.maazi.de/ltor   (keep after /ltor/health)
ProxyPass        /ltor  ws://127.0.0.1:8646/ltor  timeout=3600
ProxyPassReverse /ltor  ws://127.0.0.1:8646/ltor

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=()"

    # Hashed build assets never change → cache for a year; index.html never.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
</IfModule>

<IfModule mod_mime.c>
    AddType model/gltf-binary .glb
</IfModule>
