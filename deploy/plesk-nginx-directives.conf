# ---------------------------------------------------------------------------
# FALLBACK – only if the WebSocket does not connect through Apache.
#
# In Plesk's default "nginx as reverse proxy for Apache" mode, nginx sits in
# front of Apache. If wss://ltor.maazi.de/ltor fails (browser console shows
# "[ltor:ws] disconnected", StatusBar stays on "Remote/Offline"), let nginx
# hand the WebSocket directly to Node:
#
# Plesk → ltor.maazi.de → Apache & nginx Settings
#   → "Additional nginx directives" → paste this block
# and remove the two "/ltor" ProxyPass blocks from the Apache directives.
# ---------------------------------------------------------------------------

location = /ltor/health {
    proxy_pass http://127.0.0.1:8646;
    proxy_set_header Host $host;
}

location = /ltor {
    proxy_pass http://127.0.0.1:8646;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
